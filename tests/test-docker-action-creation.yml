name: Test Docker action creation step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Python distribution packages
        run: |
          mkdir -p dist
          # Create a minimal valid wheel file (zip format with required metadata)
          mkdir -p /tmp/wheel_build5/docker_test_pkg-1.0.0.dist-info
          cat > /tmp/wheel_build5/docker_test_pkg-1.0.0.dist-info/WHEEL <<'EOF'
          Wheel-Version: 1.0
          Generator: test
          Root-Is-Purelib: true
          Tag: py3-none-any
          EOF
          cat > /tmp/wheel_build5/docker_test_pkg-1.0.0.dist-info/METADATA <<'EOF'
          Metadata-Version: 2.1
          Name: docker-test-pkg
          Version: 1.0.0
          Summary: A test package for Docker action creation
          EOF
          cat > /tmp/wheel_build5/docker_test_pkg-1.0.0.dist-info/RECORD <<'EOF'
          docker_test_pkg-1.0.0.dist-info/WHEEL,sha256=abc,100
          docker_test_pkg-1.0.0.dist-info/METADATA,sha256=def,200
          docker_test_pkg-1.0.0.dist-info/RECORD,,
          EOF
          cd /tmp/wheel_build5 && zip -r "$GITHUB_WORKSPACE/dist/docker_test_pkg-1.0.0-py3-none-any.whl" .
          echo "Created wheel file:"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          password: pypi-fake-token-for-testing-only
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          verify-metadata: 'false'
          attestations: 'false'

      - name: Assert generated Docker action file was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          GENERATED_ACTION=".github/.tmp/.generated-actions/run-pypi-publish-in-docker-container/action.yml"
          if [ -f "$GENERATED_ACTION" ]; then
            echo "PASS: Generated Docker action file exists at $GENERATED_ACTION"
            echo "Contents:"
            cat "$GENERATED_ACTION"
          else
            echo "INFO: Generated action file not found (may have been cleaned up)"
            echo "This is acceptable - the action may clean up after itself"
          fi
          # The key assertion: the action should have run (either succeeded or failed gracefully)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
