name: Test basic usage generates Docker trampoline action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any stale generated action
        run: rm -rf "$GITHUB_WORKSPACE/.github/.tmp/.generated-actions"
      # No real distributions and no real index credentials exist under the
      # harness, so the final Docker/twine stage cannot succeed. The step is
      # expected to fail; we assert on the generated trampoline action, which
      # is deterministic.
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages-dir: does-not-exist-dist/
          repository-url: https://example.invalid/legacy/
          password: not-a-real-token
          attestations: 'false'
      - name: Assert step outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no dists / no reachable image), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert generated trampoline action
        run: |
          F="$GITHUB_WORKSPACE/.github/.tmp/.generated-actions/run-pypi-publish-in-docker-container/action.yml"
          if [ ! -f "$F" ]; then
            echo "FAIL: generated action not found at $F"
            exit 1
          fi
          cat "$F"; echo
          python3 - "$F" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          errors = []
          runs = data.get('runs', {})
          if runs.get('using') != 'docker':
              errors.append(f"runs.using expected docker, got {runs.get('using')!r}")
          image = runs.get('image', '')
          if image.startswith('docker://ghcr.io/'):
              tag = image.rsplit(':', 1)
              if len(tag) != 2 or not tag[1] or '/' in tag[1]:
                  errors.append(f"bad image tag: {image!r}")
          elif not image.endswith('/Dockerfile'):
              errors.append(f"unexpected image: {image!r}")
          expected = {'user', 'password', 'repository-url', 'packages-dir',
                      'verify-metadata', 'skip-existing', 'verbose',
                      'print-hash', 'attestations'}
          got = set(data.get('inputs', {}).keys())
          if got != expected:
              errors.append(f"inputs mismatch: {sorted(got)}")
          for k, v in data.get('inputs', {}).items():
              if v.get('required') is not False:
                  errors.append(f"input {k} should not be required")
          if errors:
              print('FAIL:', *errors, sep='\n  ')
              sys.exit(1)
          print('PASS: trampoline action is valid, image =', image)
          EOF
