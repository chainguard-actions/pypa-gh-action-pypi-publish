name: Test custom packages-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Python distribution packages in custom directory
        run: |
          mkdir -p my-custom-dist
          # Create a minimal valid wheel file (zip format with required metadata)
          mkdir -p /tmp/wheel_build2/my_package-2.0.0.dist-info
          cat > /tmp/wheel_build2/my_package-2.0.0.dist-info/WHEEL <<'EOF'
          Wheel-Version: 1.0
          Generator: test
          Root-Is-Purelib: true
          Tag: py3-none-any
          EOF
          cat > /tmp/wheel_build2/my_package-2.0.0.dist-info/METADATA <<'EOF'
          Metadata-Version: 2.1
          Name: my-package
          Version: 2.0.0
          Summary: A test package
          EOF
          cat > /tmp/wheel_build2/my_package-2.0.0.dist-info/RECORD <<'EOF'
          my_package-2.0.0.dist-info/WHEEL,sha256=abc,100
          my_package-2.0.0.dist-info/METADATA,sha256=def,200
          my_package-2.0.0.dist-info/RECORD,,
          EOF
          cd /tmp/wheel_build2 && zip -r "$GITHUB_WORKSPACE/my-custom-dist/my_package-2.0.0-py3-none-any.whl" .
          echo "Created wheel file in custom directory:"
          ls -la "$GITHUB_WORKSPACE/my-custom-dist/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          password: pypi-fake-token-for-testing-only
          repository-url: https://test.pypi.org/legacy/
          packages-dir: my-custom-dist
          verify-metadata: 'false'
          attestations: 'false'

      - name: Assert action ran with custom packages-dir and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid
          # but it should have picked up the custom packages-dir correctly
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
