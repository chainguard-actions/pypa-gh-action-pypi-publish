---
# Test: deprecated snake_case input aliases work correctly
# The action supports both kebab-case (canonical) and snake_case (deprecated) inputs.
# This test verifies that the deprecated aliases are accepted and processed.
name: Test deprecated input aliases
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal valid Python wheel for testing
        run: |
          mkdir -p dist
          WHEEL_DIR=$(mktemp -d)
          mkdir -p "${WHEEL_DIR}/aliaspackage-1.0.0.dist-info"
          cat > "${WHEEL_DIR}/aliaspackage-1.0.0.dist-info/METADATA" <<'EOF'
          Metadata-Version: 2.1
          Name: aliaspackage
          Version: 1.0.0
          Summary: A test package for alias testing
          EOF
          cat > "${WHEEL_DIR}/aliaspackage-1.0.0.dist-info/WHEEL" <<'EOF'
          Wheel-Version: 1.0
          Generator: test
          Root-Is-Purelib: true
          Tag: py3-none-any
          EOF
          cat > "${WHEEL_DIR}/aliaspackage-1.0.0.dist-info/RECORD" <<'EOF'
          aliaspackage-1.0.0.dist-info/METADATA,,
          aliaspackage-1.0.0.dist-info/WHEEL,,
          aliaspackage-1.0.0.dist-info/RECORD,,
          EOF
          cd "${WHEEL_DIR}"
          zip -r "$GITHUB_WORKSPACE/dist/aliaspackage-1.0.0-py3-none-any.whl" .
          echo "Created wheel:"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Run pypi-publish with deprecated snake_case aliases (expect failure at upload)
        id: publish
        uses: .
        continue-on-error: true
        with:
          user: __token__
          password: pypi-fake-token-for-testing-only-1234567890abcdef
          # Using deprecated snake_case aliases instead of kebab-case
          repository_url: https://test.pypi.org/legacy/
          packages_dir: dist
          verify_metadata: 'true'
          skip_existing: 'false'
          verbose: 'true'
          print_hash: 'true'
          attestations: 'false'

      - name: Assert action ran with deprecated aliases
        run: |
          echo "Action outcome: ${{ steps.publish.outcome }}"
          # The action is expected to fail because we used a fake token.
          # What matters is that it ran and processed the deprecated aliases correctly.
          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "PASS: action failed as expected (fake token rejected by TestPyPI)"
          elif [ "${{ steps.publish.outcome }}" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.publish.outcome }}"
            exit 1
          fi
