name: Test username+password upload to PyPI is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any stale generated action
        run: rm -rf "$GITHUB_WORKSPACE/.github/.tmp/.generated-actions"
      # Password-based uploads to pypi.org are disabled by the action
      # (exit 1). Whether it fails there or earlier at image resolution
      # under the harness, the step must not succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          user: some-user
          password: some-password
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: does-not-exist-dist
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected password auth to pypi.org to fail, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert trampoline generated before failure
        run: |
          F="$GITHUB_WORKSPACE/.github/.tmp/.generated-actions/run-pypi-publish-in-docker-container/action.yml"
          if [ ! -f "$F" ]; then
            echo "FAIL: generated action not found"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['runs']['using']=='docker', d" "$F"
          echo "PASS"
