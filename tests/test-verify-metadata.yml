---
# Test that verify-metadata correctly validates package metadata.
# This test creates a valid wheel and verifies the action runs twine check.
# Since we don't have real credentials, the action will fail at upload,
# but we verify it gets past the metadata check step.
name: Test verify-metadata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: pypa/gh-action-pypi-publish
      GITHUB_REPOSITORY_OWNER: pypa
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Python wheel fixture
        run: |
          mkdir -p dist
          python3 -c "
          import zipfile, os
          os.makedirs('dist', exist_ok=True)
          whl = 'dist/verifypkg_test_ci-0.2.0-py3-none-any.whl'
          with zipfile.ZipFile(whl, 'w') as zf:
              zf.writestr('verifypkg_test_ci-0.2.0.dist-info/METADATA', 'Metadata-Version: 2.1\nName: verifypkg-test-ci\nVersion: 0.2.0\n')
              zf.writestr('verifypkg_test_ci-0.2.0.dist-info/WHEEL', 'Wheel-Version: 1.0\nGenerator: test\nRoot-Is-Purelib: true\nTag: py3-none-any\n')
              zf.writestr('verifypkg_test_ci-0.2.0.dist-info/RECORD', '')
          print('Created', whl)
          "
          ls -la dist/

      - name: Run pypi-publish with verify-metadata enabled
        id: publish-verify
        uses: .
        continue-on-error: true
        with:
          password: pypi-fake-token-for-testing-only
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          verify-metadata: 'true'
          skip-existing: 'false'
          verbose: 'false'
          print-hash: 'false'
          attestations: 'false'

      - name: Assert action ran with verify-metadata
        env:
          OUTCOME: ${{ steps.publish-verify.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should run (not be skipped). It may fail at upload
          # since we don't have real credentials, but it should pass twine check.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: Action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: Action ran with verify-metadata enabled (outcome: $OUTCOME)"
