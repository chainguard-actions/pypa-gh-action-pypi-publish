name: Test skip-existing, packages-dir, and print-hash inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom packages directory with a fake wheel
        run: |
          mkdir -p my-packages
          # Create a minimal fake wheel file so the action has something to upload
          touch my-packages/dummy_package-0.1.0-py3-none-any.whl
      - id: action
        uses: .
        continue-on-error: true
        with:
          password: fake-token-for-testing
          repository-url: https://test.pypi.org/legacy/
          packages-dir: my-packages
          skip-existing: 'true'
          print-hash: 'true'
          verify-metadata: 'false'
      - name: Assert action ran (may fail due to invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to fake token)"
