name: Test basic inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy dist directory with a fake package
        run: |
          mkdir -p dist
          # Create a minimal wheel file (just needs to exist for the action to find it)
          touch dist/example_package-1.0.0-py3-none-any.whl
      - id: action
        uses: .
        continue-on-error: true
        with:
          password: fake-token-for-testing
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          verify-metadata: 'false'
          skip-existing: 'true'
          print-hash: 'true'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with invalid credentials against TestPyPI
          # but we verify it ran (not skipped) and the inputs were accepted
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with all required inputs"
