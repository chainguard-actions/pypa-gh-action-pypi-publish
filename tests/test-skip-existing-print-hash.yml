name: Test skip-existing and print-hash inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy dist directory with a package
        run: |
          mkdir -p dist
          touch dist/mypackage-1.0.0-py3-none-any.whl

      - id: action
        uses: .
        continue-on-error: true
        with:
          password: fake-token-for-testing
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          verify-metadata: 'false'
          skip-existing: 'true'
          print-hash: 'true'

      - name: Assert action ran (may fail at upload stage)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the Docker/upload stage with a fake token
          # but we verify it was invoked with skip-existing and print-hash inputs
          echo "PASS: action was invoked with skip-existing and print-hash inputs"
