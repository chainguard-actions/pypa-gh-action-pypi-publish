---

name: 🏗️

on:
  pull_request:
  push:
    branches:
    - release/*
    - unstable/*
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string

permissions: {}

jobs:
  smoke-test:
    uses: ./.github/workflows/reusable-smoke-test.yml

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - smoke-test

    runs-on: ubuntu-latest

    timeout-minutes: 1

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # release/v1
      with:
        jobs: ${{ toJSON(needs) }}

  build-and-push:
    permissions:
      packages: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
    - check
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Build Docker image
      run: |
        safe_tag=$(printf '%s' "$DOCKER_TAG" | tr -d '\n\r')
        safe_tag="${safe_tag/'/'/'-'}"
        DOCKER_TAG_MAJOR=$(echo "$safe_tag" | cut -d '.' -f 1)
        DOCKER_TAG_MAJOR=$(printf '%s' "$DOCKER_TAG_MAJOR" | tr -d '\n\r')
        DOCKER_TAG_MAJOR_MINOR=$(echo "$safe_tag" | cut -d '.' -f 1-2)
        DOCKER_TAG_MAJOR_MINOR=$(printf '%s' "$DOCKER_TAG_MAJOR_MINOR" | tr -d '\n\r')
        IMAGE="ghcr.io/$GITHUB_REPOSITORY:${safe_tag}"
        IMAGE=$(printf '%s' "$IMAGE" | tr -d '\n\r')
        IMAGE_MAJOR="ghcr.io/$GITHUB_REPOSITORY:${DOCKER_TAG_MAJOR}"
        IMAGE_MAJOR=$(printf '%s' "$IMAGE_MAJOR" | tr -d '\n\r')
        IMAGE_MAJOR_MINOR="ghcr.io/$GITHUB_REPOSITORY:${DOCKER_TAG_MAJOR_MINOR}"
        IMAGE_MAJOR_MINOR=$(printf '%s' "$IMAGE_MAJOR_MINOR" | tr -d '\n\r')
        IMAGE_SHA="ghcr.io/$GITHUB_REPOSITORY:${GITHUB_SHA}"
        IMAGE_SHA=$(printf '%s' "$IMAGE_SHA" | tr -d '\n\r')
        echo "IMAGE=$IMAGE" >>"$GITHUB_ENV"
        echo "IMAGE_MAJOR=$IMAGE_MAJOR" >>"$GITHUB_ENV"
        echo "IMAGE_MAJOR_MINOR=$IMAGE_MAJOR_MINOR" >>"$GITHUB_ENV"
        echo "IMAGE_SHA=$IMAGE_SHA" >>"$GITHUB_ENV"
        docker build . \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$IMAGE" \
          --tag "$IMAGE"
        docker tag "$IMAGE" "$IMAGE_MAJOR"
        docker tag "$IMAGE" "$IMAGE_MAJOR_MINOR"
        docker tag "$IMAGE" "$IMAGE_SHA"
      env:
        DOCKER_TAG: ${{ inputs.tag || github.ref_name }}
    - name: Log in to GHCR
      run: >-
        echo "$GHCR_TOKEN" |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Docker image to GHCR
      run: |
        docker push "$IMAGE"
        docker push "$IMAGE_MAJOR"
        docker push "$IMAGE_MAJOR_MINOR"
        docker push "$IMAGE_SHA"
